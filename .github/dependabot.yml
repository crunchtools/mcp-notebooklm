# Dependabot config for a container-only repo. See constitution.md Section XV.
#
# No uv block: this repo packages an upstream project and carries no
# pyproject.toml or uv.lock of its own. github-actions is the one ecosystem
# present, and a `uses: some-action@vX.Y.Z` pin goes stale exactly like a
# lockfile entry does.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
