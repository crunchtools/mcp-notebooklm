# Dependabot config for a container-only repo. See constitution.md Section XV.
#
# The pip block keeps requirements.txt (the wrapped CLI's hash-pinned
# transitive closure) current; no uv.lock because the repo carries no pyproject. github-actions is the one ecosystem
# present, and a `uses: some-action@vX.Y.Z` pin goes stale exactly like a
# lockfile entry does.

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "crunchtools/constitution*"
